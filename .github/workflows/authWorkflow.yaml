name: Auth Workflow

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      artifact-name:
        description: Name of the artifact to upload
        required: true
        default: build-artifacts-test-artifacts
        type: string

env:
  MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
  MONGODB_URL: ${{ secrets.MONGODB_URL }}
  ARTIFACT_NAME: ${{ inputs.artifact-name || 'build-artifacts-test-artifacts' }}

jobs:
  build:
    continue-on-error: true
    environment: production
    strategy:
      matrix:
        node-version: ["25", "26"]
        operating-system: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.operating-system }}
    container:
      image: node:latest
    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
    outputs:
      script-file: ${{ steps.publishing.outputs.script-file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        id: cache-dependencies
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ matrix.operating-system }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ matrix.operating-system }}-node-${{ matrix.node-version }}-

      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Initialise Prisma Client
        run: npx prisma generate

      - name: Build Project
        run: npm run build

      - name: "Publish JS filename"
        id: publishing
        run: node -e "const fs = require('node:fs'); const file = fs.readdirSync('dist').find((name) => name.endsWith('.js')); if (file) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'script-file=' + file + require('node:os').EOL)";
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.operating-system }}-${{ matrix.node-version }}
          path: dist

  push-schema:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: [self-hosted, label-Wsx64]
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Cache node_modules
        id: cache-dependencies
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: Windows-node-latest-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Windows-node-latest-

      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Push Prisma Schema
        run: npx prisma db push

  test:
    needs: [push-schema, build]
    environment: testing
    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
      JWT_AUTH_TOKEN: ${{ secrets.JWT_AUTH_TOKEN }}
      JWT_AUTH_TOKEN_EXPIRES_IN: 1h
      APP_PORT: 9800
    runs-on: [self-hosted, label-Wsx64]
    outputs:
      unit-tests-outcome: ${{ steps.run-unit-tests.outcome }}
      tests-outcome: ${{ steps.run-tests.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Cache node_modules
        id: cache-dependencies
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: Windows-node-latest-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Windows-node-

      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Initialise Prisma Client
        run: npx prisma generate

      - name: Run Jest unit tests
        id: run-unit-tests
        run: |
          node -e "require('fs').mkdirSync('test-results', { recursive: true })"
          npm test -- --runInBand --outputFile=test-results/results.json

      - name: Run Server
        run: |
          taskkill /F /IM node.exe || true
          npm start &
          npx --yes wait-on http://localhost:9800 --timeout 300000 || npx --yes wait-on http://localhost:1200 --timeout 300000

      - name: Run Tests
        id: run-tests
        run: |
          node -e "require('fs').mkdirSync('test-results2', { recursive: true })"
          npm test -- --json --outputFile=test-results2/results2.json
        env:
          BASE_URL: http://localhost:9800

      - name: Upload Test Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            test-results
            test-results2

  deploy:
    permissions:
      id-token: write
      contents: read
    needs: [build, test]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}-ubuntu-latest-latest
          path: dist
          merge-multiple: true

      - name: Download first-Test Artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-artifacts
          path: test-results

      - name: Download second-Test Artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-artifacts
          path: test-results2

      - name: Output JS filenames
        run: ls -la dist

      - name: Output unit tests result
        run: echo "Unit tests (run-unit-tests) ${{ needs.test.outputs.unit-tests-outcome }}"

      - name: Output tests result
        run: echo "Tests (run-tests) ${{ needs.test.outputs.tests-outcome }}"

      - name: Output the filename
        run: echo "${{needs.build.outputs.script-file}}"

      - name: Deploy
        run: |
          echo "${{ needs.test.result }}"
          echo "${{ needs.deploy.result }}"

  failure-report:
    needs: [test, deploy]
    permissions:
      contents: read
      issues: write
    if: ${{ cancelled() || (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report information
        run: |
          echo "Issue report referring to test and deploy failures"
          echo "$GITHUB_STEP_SUMMARY"

      - name: Assign failure label
        if: contains(github.event.issue.labels.*.name, 'failure')
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels \
            -d '{"labels":["failure"]}' \
            --fail
