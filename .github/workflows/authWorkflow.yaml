name: Auth Workflow

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      artifact-name:
        description: Name of the artifact to upload
        required: true
        default: build-artifacts/test-artifacts
        type: string

env:
  MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
  ARTIFACT_NAME: ${{ inputs.artifact-name || 'build-artifacts/test-artifacts' }}

jobs:
  build:
    continue-on-error: true
    environment: production
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
        operating-system: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.operating-system }}
    outputs:
      script-file: ${{ steps.publishing.outputs.script-file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Initialise Prisma Client
        run: npx prisma generate

      - name: Build Project
        run: npm run build

      - name: Push Prisma schema to database
        if: github.ref == 'refs/heads/master'
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: "Publish JS filename"
        id: publishing
        run: node -e "const fs = require('node:fs'); const file = fs.readdirSync('dist').find((name) => name.endsWith('.js')); if (file) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'script-file=' + file + require('node:os').EOL)";
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.operating-system }}-${{ matrix.node-version }}
          path: dist

  test:
    needs: build
    environment: testing
    env:
      MONGODB_URI: mongodb://mongo:27017/${{ secrets.MONGO_DB_NAME }}
      MONGODB_USER: ${{ secrets.MONGODB_USER }}
    runs-on: ubuntu-latest
    container:
      image: node:22
      options: --user node
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: auth-automation

      - name: Run Server
        run: |
          npm start &
          npx --yes wait-on http://localhost:1200/${{env.MONGO_DB_NAME}} --timeout 60000
        working-directory: auth-automation

      - name: Run Tests
        id: run-tests
        run: npm test -- --json --outputFile=test-results/results.json
        working-directory: auth-automation
        env:
          BASE_URL: http://localhost:1200/${{env.MONGO_DB_NAME}}

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test-results

  deploy:
    permissions:
      id-token: write
      contents: read
    needs: test
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-ubuntu-latest-22
          path: dist

      - name: Output JS filenames
        run: ls
        working-directory: auth-automation/dist

      - name: Output the filename
        run: echo "${{needs.build.outputs.script-file}}"

      - name: Deploy
        run: echo "${{ needs.test.result }}"
        working-directory: auth-automation
  failure-report:
    needs: [test, deploy]
    if: ${{ cancelled() || (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report information
        run: |
          echo "Issue report referring to test and deploy failures"
          echo "$GITHUB_STEP_SUMMARY"
